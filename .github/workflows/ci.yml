name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    name: Pipeline · lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check pipeline api evaluation tests
      # Includes the web contract tests: the committed JSON the site is built
      # from must match a fresh run and satisfy web/src/lib/types.ts.
      - run: python -m pytest

  web:
    name: Web · lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
