name: Keep API warm

# Render's free tier puts the upload API to sleep after 15 idle minutes, and
# waking it takes 30-60 s. A light ping every 10 minutes keeps it awake
# (one always-on service fits within the free tier's monthly hours).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 120 https://supplier-intelligence-api-zfcf.onrender.com/api/health || true
