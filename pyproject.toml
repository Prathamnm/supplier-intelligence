[project]
name = "supplier-intelligence"
version = "1.0.0"
description = "Supplier scorecard, rupee-quantified losses, return attribution and negotiation briefs for Arora Traders."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Markdown report prose; wrapping it would hurt readability more than help.
"evaluation/run.py" = ["E501"]
